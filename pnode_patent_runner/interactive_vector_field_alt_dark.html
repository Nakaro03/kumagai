<!DOCTYPE html>
<!-- CoPE 潜在マップ既定テンプレ: run_interactive_landscape_cope_vector_field の --html-template 既定。成果物例 map_cope_alt_dark.html -->
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>__PAGE_TITLE__</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; background: #0c0e12; color: #c8cdd8; min-height: 100vh; }
    .shell { display: flex; flex-direction: row; align-items: stretch; min-height: 100vh; gap: 0; }
    .panel {
      flex: 0 0 272px; padding: 14px 16px 20px; background: linear-gradient(180deg, #141820 0%, #0e1117 100%);
      border-right: 1px solid rgba(100, 120, 160, 0.22); overflow-y: auto; max-height: 100vh;
    }
    .main { flex: 1 1 auto; display: flex; flex-direction: row; align-items: stretch; min-width: 0; gap: 0; }
    .plot-wrap { flex: 1 1 auto; display: flex; flex-direction: column; padding: 12px 10px 16px 14px; min-width: 0; }
    .detail-panel {
      flex: 0 0 300px; max-width: 340px; padding: 14px 14px 20px;
      background: linear-gradient(180deg, #151a22 0%, #0e1118 100%);
      border-left: 1px solid rgba(100, 120, 160, 0.25);
      overflow-y: auto; max-height: 100vh; font-size: 0.8rem; color: #c4ccd8;
    }
    .detail-panel h2 { font-size: 0.78rem; margin: 0 0 10px; font-weight: 600; color: #94a3b8; letter-spacing: 0.04em; text-transform: uppercase; }
    .detail-panel .detail-badge {
      display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px;
      background: rgba(59, 130, 246, 0.22); color: #93c5fd; border: 1px solid rgba(96, 165, 250, 0.35);
    }
    .detail-panel .detail-badge.corp { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border-color: rgba(251, 191, 36, 0.35); }
    .detail-panel .detail-placeholder { color: #64748b; line-height: 1.5; font-size: 0.78rem; }
    .detail-panel dl { margin: 0; padding: 0; }
    .detail-panel dt { color: #7c8ca0; font-size: 0.72rem; margin-top: 10px; margin-bottom: 3px; }
    .detail-panel dd { margin: 0 0 0 0; color: #e8ecf4; line-height: 1.45; word-break: break-word; white-space: pre-wrap; font-size: 0.78rem; }
    .detail-panel dd.mono { font-family: ui-monospace, monospace; font-size: 0.74rem; }
    .color-by-row { margin: 0 0 10px; font-size: 0.78rem; }
    .color-by-row label { display: block; margin-bottom: 4px; color: #8b96a8; }
    .color-by-row select { width: 100%; }
    .category-legend { max-height: 120px; overflow-y: auto; margin: 0 0 10px; padding: 8px; border-radius: 8px;
      background: rgba(12,14,20,0.65); border: 1px solid rgba(80,95,130,0.28); font-size: 0.72rem; line-height: 1.35; }
    .category-legend .row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 5px; color: #a8b0c0; }
    .category-legend .sw { flex: 0 0 11px; height: 11px; border-radius: 2px; margin-top: 2px; border: 1px solid rgba(255,255,255,0.12); }
    h1 { font-size: 0.95rem; margin: 0 0 14px; font-weight: 600; color: #e8eaf0; letter-spacing: 0.02em; line-height: 1.35; }
    #plot {
      width: 100%; flex: 1 1 auto; min-height: 420px; height: calc(100vh - 24px);
      background: #12151c; border-radius: 10px; border: 1px solid rgba(80, 95, 130, 0.35);
    }
    .year-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 0 0 12px; font-size: 0.82rem; }
    #yearSlider { flex: 1 1 140px; min-width: 120px; height: 7px; cursor: pointer; accent-color: #5b8fd4; }
    .field-toggles { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; font-size: 0.82rem; }
    .field-toggles label { cursor: pointer; }
    .field-adjustments { display: flex; flex-direction: column; gap: 10px; margin: 0 0 14px; font-size: 0.8rem; }
    .field-adjustments .adj { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .field-adjustments input[type="range"] { width: 130px; accent-color: #4a7ab8; }
    .patent-legend { display: flex; flex-direction: column; gap: 6px; margin: 0 0 12px; font-size: 0.78rem; color: #a8b0c0; }
    .patent-legend .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; border-radius: 2px; border: 1px solid rgba(255,255,255,0.15); }
    .patent-legend .swatch.teal { background: rgba(13, 148, 136, 0.92); }
    .hint { color: #7a8498; font-size: 0.76rem; line-height: 1.45; margin: 0 0 12px; }
    .bar { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 10px; font-size: 0.82rem; }
    select, button {
      background: #1a1f2a; color: #dce2ee; border: 1px solid rgba(90, 105, 140, 0.45);
      border-radius: 6px; padding: 7px 10px; max-width: 100%;
    }
    button { cursor: pointer; }
    button:hover, select:hover { border-color: rgba(120, 150, 200, 0.55); }
    #corpPick { width: 100%; min-width: 0; }
    .corp-selection-status {
      margin: 0 0 10px; padding: 10px 12px; border-radius: 8px; border: 1px dashed rgba(120, 130, 160, 0.35);
      background: rgba(20, 24, 32, 0.9); font-size: 0.82rem; line-height: 1.45; color: #a8b0c0;
    }
    .corp-selection-status.is-active { border: 2px solid #d97706; background: linear-gradient(105deg, rgba(60, 45, 20, 0.55) 0%, rgba(45, 38, 22, 0.75) 100%); color: #f5e6d0; }
    .corp-selection-status.is-joint-patent.is-active { border-color: #2dd4bf; background: linear-gradient(105deg, rgba(15, 55, 48, 0.55) 0%, rgba(12, 42, 38, 0.75) 100%); color: #ccfbf1; }
    .corp-status-label { display: inline-block; margin-right: 6px; padding: 2px 7px; border-radius: 4px;
      background: #b45309; color: #fff; font-size: 0.72rem; font-weight: 700; }
    .corp-select-wrap.has-selection { box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.5); border-radius: 6px; display: inline-block; width: 100%; }
    .tag { display: inline-block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7a94; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="panel">
      <span class="tag">alt template</span>
      <h1>__HEADING__</h1>
      <div class="year-bar">
        <label for="yearSlider" id="yearSliderLabel">年度</label>
        <span id="yearMinLabel"></span>
        <input type="range" id="yearSlider" />
        <span id="yearMaxLabel"></span>
        <strong id="yearCurrent"></strong>
      </div>
      <div class="field-toggles">
        <label><input type="checkbox" id="chkHeatmap" checked /> <span id="uiToggleHeat">Φ ヒートマップ</span></label>
        <label><input type="checkbox" id="chkContour" checked /> <span id="uiToggleContour">Φ 等高線</span></label>
        <label><input type="checkbox" id="chkArrows" checked /> <span id="uiToggleArrows">−∇Φ 短矢印</span></label>
        <label style="color:#f87171"><input type="checkbox" id="chkNodePhiDensity" /> <span id="uiToggleNodePhiD">ノード密度×Φ（赤=低Φ集中・青=高Φ集中）</span></label>
        <label><input type="checkbox" id="chkDeltaPhi" /> <span id="uiToggleDPhi">ΔΦ ヒートマップ (観測)</span></label>
        <label><input type="checkbox" id="chkDeltaPhiNodes" /> <span id="uiToggleDPhiNodes">ΔΦ ノード色分け (観測)</span></label>
        <label><input type="checkbox" id="chkMoveArrows" /> <span id="uiToggleMove">移動矢印 (前年→当年)</span></label>
        <label style="color:#fbbf24"><input type="checkbox" id="chkPredDeltaPhi" /> <span id="uiTogglePredDPhi">予測ΔΦ ヒートマップ</span></label>
        <label style="color:#fbbf24"><input type="checkbox" id="chkPredDeltaPhiNodes" /> <span id="uiTogglePredDPhiN">予測ΔΦ ノード色分け</span></label>
        <label style="color:#fbbf24"><input type="checkbox" id="chkPredMoveArrows" /> <span id="uiTogglePredMove">予測移動矢印 (当年→翌年予測)</span></label>
      </div>
      <div class="field-adjustments">
        <div class="adj"><label for="rngHeatOp">ヒート透明度</label>
          <input type="range" id="rngHeatOp" min="0.08" max="0.55" step="0.02" value="0.28" /><span id="lblHeatOp"></span></div>
        <div class="adj"><label for="rngArrowOp">矢印透明度</label>
          <input type="range" id="rngArrowOp" min="0.35" max="1" step="0.05" value="0.9" /><span id="lblArrowOp"></span></div>
        <div class="adj"><label for="selNCont">等高線本数</label>
          <select id="selNCont"><option value="10">10</option><option value="14" selected>14</option><option value="18">18</option><option value="24">24</option></select></div>
        <div class="adj"><label for="rngDeltaOp">ΔΦ 透明度</label>
          <input type="range" id="rngDeltaOp" min="0.10" max="0.70" step="0.02" value="0.38" /><span id="lblDeltaOp"></span></div>
      </div>
      <div class="patent-legend" id="jointLegend">
        <span><span class="swatch" style="background:rgba(248,113,113,0.9)"></span>単独出願</span>
        <span><span class="swatch" style="background:rgba(74,222,128,0.9)"></span>共同出願</span>
        <span><span class="swatch teal"></span>共同クリック時の関与企業</span>
      </div>
      <div id="patentColorSection" class="color-by-row" style="display:none;">
        <label for="selColorBy">特許の色分け</label>
        <select id="selColorBy">
          <option value="joint">単独 / 共同</option>
          <option value="leadIpc">Lead_IPC</option>
          <option value="fi">FI</option>
          <option value="fterm">F-term</option>
        </select>
      </div>
      <div id="categoryLegend" class="category-legend" style="display:none;" aria-label="分類凡例"></div>
      <p class="hint" id="hintSlot">元テンプレートと同じペイロード。Plotly をダーク背景＋ Viridis ヒートに変更。左パネル＋広いプロット領域。</p>
      <div class="bar">
        <label for="corpPick" id="leftSelectLabel">企業</label>
        <span class="corp-select-wrap" id="corpSelectWrap"><select id="corpPick"><option value="">— 選択なし —</option></select></span>
        <button type="button" id="btnClear">解除</button>
      </div>
      <div id="corpSelectionStatus" class="corp-selection-status"></div>
    </aside>
    <div class="main">
      <div class="plot-wrap">
        <div id="plot"></div>
      </div>
      <aside class="detail-panel" id="detailPanel">
        <h2>ノード詳細</h2>
        <div id="detailBody" class="detail-placeholder"></div>
      </aside>
    </div>
  </div>
  <script type="text/plain" id="payload-b64" style="display:none">__PAYLOAD_B64__</script>
  <script>
  function parseJsonFromBase64Utf8(b64) {
    const bin = atob(b64.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }
  const WRAP = parseJsonFromBase64Utf8(document.getElementById('payload-b64').textContent);
  const DATA = WRAP.byYear;
  const U = Object.assign({
    yearSliderLabel: '年度',
    leftSelectLabel: '企業',
    rightTraceName: '特許',
    leftTraceName: '企業',
    layoutTitleTemplate: '表示年: {year} ／ 特許 {nRight} · 企業 {nLeft}',
    corpOptionTemplate: '{name} ／ この年 {patentsYear} · 全期間 {patentsTotal}',
    statusYearRightPrefix: ' ／ この年の特許 ',
    statusYearRightSuffix: ' 件',
    jointStatusPrefix: '共同出願特許 ',
    idleHint: '企業・特許をクリックで強調。',
    hintHtml: '',
    legendInnerHtml: '',
    rightNodeLabel: '特許',
    leftNodeLabel: '企業',
    nodeScalarLabel: 'Φ（ポテンシャル）',
  }, WRAP.ui || {});
  (function applyUiFromPayload() {
    const yl = document.getElementById('yearSliderLabel');
    if (yl && U.yearSliderLabel) yl.textContent = U.yearSliderLabel;
    const ll = document.getElementById('leftSelectLabel');
    if (ll && U.leftSelectLabel) ll.textContent = U.leftSelectLabel;
    const h = document.getElementById('hintSlot');
    if (h && U.hintHtml) h.innerHTML = U.hintHtml;
    const leg = document.querySelector('.patent-legend');
    if (leg && U.legendInnerHtml) leg.innerHTML = U.legendInnerHtml;
    const pcs = document.getElementById('patentColorSection');
    if (pcs && U.domain === 'patent') pcs.style.display = 'block';
    function setToggleLabel(id, text) {
      if (!text) return;
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = text;
    }
    setToggleLabel('uiToggleHeat', U.toggleHeat);
    setToggleLabel('uiToggleContour', U.toggleContour);
    setToggleLabel('uiToggleArrows', U.toggleArrows);
    setToggleLabel('uiToggleNodePhiD', U.toggleNodePhiD);
    setToggleLabel('uiToggleDPhi', U.toggleDPhi);
    setToggleLabel('uiToggleDPhiNodes', U.toggleDPhiNodes);
    setToggleLabel('uiToggleMove', U.toggleMove);
    setToggleLabel('uiTogglePredDPhi', U.togglePredDPhi);
    setToggleLabel('uiTogglePredDPhiN', U.togglePredDPhiN);
    setToggleLabel('uiTogglePredMove', U.togglePredMove);
  })();
  let currentYear = String(WRAP.defaultYear);
  let colorBy = 'joint';
  const singleColor = 'rgba(248, 113, 113, 0.92)';
  const jointColor = 'rgba(74, 222, 128, 0.92)';
  const highlightSingle = 'rgb(255, 80, 80)';
  const highlightJoint = 'rgb(34, 197, 94)';
  const dimColor = 'rgba(100, 110, 130, 0.2)';
  let showHeatmap = true, showContour = true, showArrows = true;
  let showNodePhiDensity = false;
  let showDeltaPhi = false, showDeltaPhiNodes = false, showMoveArrows = false;
  let showPredDeltaPhi = false, showPredDeltaPhiNodes = false, showPredMoveArrows = false;
  let heatmapOpacity = 0.28, arrowOpacity = 0.9, nContourLevels = 14, deltaPhiOpacity = 0.38;
  let jointPartnerHighlight = new Set(), selectedJointPatentId = '';
  function currentPayload() { return DATA[currentYear]; }
  function isJoint(p) { return p.joint === true; }
  function firstCategoryToken(raw) {
    const s = (raw || '').trim();
    if (!s) return '';
    const parts = s.split(/[,;\n\r]+/).map(function (x) { return x.trim(); }).filter(Boolean);
    return parts[0] || s;
  }
  function patentColorKey(p, mode) {
    const m = mode || colorBy;
    let raw = '';
    if (m === 'leadIpc') raw = (p.leadIpc != null && String(p.leadIpc).trim()) ? String(p.leadIpc).trim() : '';
    else if (m === 'fi') raw = (p.fi != null && String(p.fi).trim()) ? String(p.fi).trim() : '';
    else if (m === 'fterm') raw = (p.fterm != null && String(p.fterm).trim()) ? String(p.fterm).trim() : '';
    if ((m === 'fi' || m === 'fterm') && raw) raw = firstCategoryToken(raw);
    return raw || '（未設定）';
  }
  function colorForCategoryKey(key, bright) {
    const k = key || '（未設定）';
    if (k === '（未設定）') return bright ? 'rgba(186,196,210,0.95)' : 'rgba(115,120,135,0.88)';
    let h = 0;
    for (let i = 0; i < k.length; i++) h = ((h << 5) - h) + k.charCodeAt(i) | 0;
    h = Math.abs(h) % 360;
    const s = bright ? 70 : 58;
    const l = bright ? 58 : 48;
    const a = bright ? 0.96 : 0.9;
    return `hsla(${h}, ${s}%, ${l}%, ${a})`;
  }
  function baseColorsForPatents(P) {
    const mode = colorBy;
    if (mode === 'joint') return P.patents.map(p => (isJoint(p) ? jointColor : singleColor));
    return P.patents.map(p => colorForCategoryKey(patentColorKey(p, mode), false));
  }
  function patentColorsForCorp(P, corpName) {
    const mode = colorBy;
    if (!corpName) return baseColorsForPatents(P);
    const linked = new Set(P.corpToPatentIds[corpName] || []);
    return P.patents.map(p => {
      if (!linked.has(p.id)) return dimColor;
      if (mode === 'joint') return isJoint(p) ? highlightJoint : highlightSingle;
      return colorForCategoryKey(patentColorKey(p, mode), true);
    });
  }
  function refreshCategoryLegend(P) {
    const catEl = document.getElementById('categoryLegend');
    const jointEl = document.getElementById('jointLegend');
    if (!catEl || !jointEl) return;
    if (U.domain !== 'patent') { catEl.style.display = 'none'; jointEl.style.display = ''; return; }
    if (colorBy === 'joint') {
      catEl.style.display = 'none';
      jointEl.style.display = '';
      return;
    }
    jointEl.style.display = 'none';
    catEl.style.display = 'block';
    const counts = {};
    P.patents.forEach(p => {
      const k = patentColorKey(p, colorBy);
      counts[k] = (counts[k] || 0) + 1;
    });
    const keys = Object.keys(counts).sort((a,b) => counts[b] - counts[a] || a.localeCompare(b));
    const label = colorBy === 'leadIpc' ? 'Lead_IPC' : (colorBy === 'fi' ? 'FI' : 'F-term');
    const sub = (colorBy === 'fi' || colorBy === 'fterm')
      ? '<div style="color:#64748b;font-size:0.65rem;margin-bottom:6px">※ 複数ある場合は先頭区分で着色</div>' : '';
    catEl.innerHTML = sub + '<div style="color:#8b9cb0;margin-bottom:6px;font-size:0.7rem">' + label + '（この年）</div>' +
      keys.map(k => {
        const c = colorForCategoryKey(k, false);
        const short = k.length > 42 ? (k.slice(0, 40) + '…') : k;
        return '<div class="row"><span class="sw" style="background:' + c + '"></span><span>'
          + short.replace(/</g,'&lt;') + ' <span style="color:#6b7a94">(' + counts[k] + ')</span></span></div>';
      }).join('');
  }
  function renderDetailPlaceholder() {
    const el = document.getElementById('detailBody');
    if (!el) return;
    el.className = 'detail-placeholder';
    el.textContent = 'プロット上の' + U.rightNodeLabel + '（四角）または' + U.leftNodeLabel + '（丸）をクリックすると、ここにメタデータを表示します。';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderPatentDetail(d) {
    const el = document.getElementById('detailBody');
    if (!el || !d) return;
    el.className = '';
    let order, titles;
    if (U.domain === 'author_topic') {
      order = ['topic','title','year','linked_authors','url','description'];
      titles = { topic: 'トピック', title: 'タイトル', year: '年', linked_authors: '関連著者数', url: 'URL', description: '説明' };
    } else if (U.domain === 'author_paper') {
      order = ['paper_id','title','year','url','description'];
      titles = { paper_id: '論文ID', title: 'タイトル', year: '年', url: 'URL', description: '要約' };
    } else {
      order = ['patent_number','patent_name','date','year','year_month','corporation','lead_ipc','ipc','fi','fterm','keyword','topic_id','lead_inventor','inventors','description'];
      titles = { patent_number: '特許番号', patent_name: '名称', date: '日付', year: '年', year_month: 'year_month',
        corporation: '企業', lead_ipc: 'Lead_IPC', ipc: 'IPC', fi: 'FI', fterm: 'F-term', keyword: 'キーワード', topic_id: 'topic_id',
        lead_inventor: '代表発明者', inventors: '発明者', description: '要約/説明' };
    }
    let html = '';
    order.forEach(k => {
      if (d[k] != null && String(d[k]).trim() !== '') {
        const isUrl = (k === 'url' && String(d[k]).startsWith('http'));
        const val = isUrl
          ? '<a href="' + esc(d[k]) + '" target="_blank" rel="noopener" style="color:#60a5fa;word-break:break-all">' + esc(d[k]) + '</a>'
          : esc(d[k]);
        html += '<dt>' + esc(titles[k] || k) + '</dt><dd>' + val + '</dd>';
      }
    });
    if (d.phi != null) html += '<dt>' + esc(U.nodeScalarLabel || 'Φ（ポテンシャル）') + '</dt><dd>' + esc(Number(d.phi).toFixed(4)) + '</dd>';
    if (d.deltaPhi != null) html += '<dt>観測ΔΦ</dt><dd>' + esc(Number(d.deltaPhi).toFixed(4)) + '</dd>';
    if (d.predDeltaPhi != null) html += '<dt>予測ΔΦ</dt><dd>' + esc(Number(d.predDeltaPhi).toFixed(4)) + '</dd>';
    el.innerHTML = '<span class="detail-badge">' + esc(U.rightNodeLabel) + 'ノード</span><dl>' + html + '</dl>';
  }
  function renderCorpDetail(d) {
    const el = document.getElementById('detailBody');
    if (!el || !d) return;
    el.className = '';
    el.innerHTML = '<span class="detail-badge corp">' + esc(U.leftNodeLabel) + 'ノード</span><dl>'
      + '<dt>' + esc(U.leftNodeLabel) + '名</dt><dd>' + esc(d.name||'') + '</dd>'
      + '<dt>表示年</dt><dd>' + esc(d.year||'') + '</dd>'
      + '<dt>この年の' + esc(U.rightNodeLabel) + '（グラフ）</dt><dd>' + esc(d.patentsYear||'') + ' 件</dd>'
      + '<dt>全期間（CSV）</dt><dd>' + esc(d.patentsTotal||'') + ' 件</dd>'
      + '</dl>';
  }
  function corpMarkerArrays(P, selectedName, jointSet) {
    const selN = selectedName || '', jset = jointSet && jointSet.size ? jointSet : new Set();
    const fill = [], size = [], lineW = [], lineC = [];
    P.corporations.forEach(c => {
      const orange = Boolean(selN) && c.name === selN;
      const teal = !orange && jset.has(c.name);
      if (orange) { fill.push('rgba(251, 191, 36, 0.95)'); size.push(17); lineW.push(2.4); lineC.push('#78350f'); }
      else if (teal) { fill.push('rgba(45, 212, 191, 0.92)'); size.push(15); lineW.push(2.2); lineC.push('#0f766e'); }
      else { fill.push('rgba(96, 165, 250, 0.88)'); size.push(11); lineW.push(0.5); lineC.push('rgba(12,14,18,0.95)'); }
    });
    return { fill, size, lineW, lineC };
  }
  function fieldLayerTraces(P) {
    const F = P.vectorField, out = [];
    if (!F) return out;

    let meta = {};
    try {
      const s = typeof pt.customdata === 'string' ? pt.customdata : (Array.isArray(pt.customdata) ? pt.customdata[0] : '');
      if (s && s.charAt(0) === '{') meta = JSON.parse(s);
    } catch (e) {}
    return meta;
  }
  plotEl.on('plotly_click', (ev) => {
    const pt = ev.points && ev.points[0]; if (!pt) return;
    const P = currentPayload(), pi = patentTraceIndex(P), ci = corpTraceIndex(P);
    if (pt.curveNumber === ci) {
      const meta = parseClickMeta(pt);
      if (meta.type === 'corp' && meta.detail) renderCorpDetail(meta.detail);
      const nm = meta.name || (meta.detail && meta.detail.name) || '';
      if (nm) { applyHighlight(nm); return; }
      return;
    }
    if (pt.curveNumber !== pi) return;
    const meta = parseClickMeta(pt);
    if (meta.type === 'patent' && meta.detail) renderPatentDetail(meta.detail);
    else if (meta.detail) renderPatentDetail(meta.detail);
    if (meta.joint && Array.isArray(meta.coApplicants) && meta.coApplicants.length >= 2) {
      selectedJointPatentId = String(meta.id||''); jointPartnerHighlight = new Set(meta.coApplicants.map(String)); sel.value = '';
      Plotly.react('plot', buildTraces(P, baseColorsForPatents(P), '', jointPartnerHighlight), layout, plotOpts); refreshStatusBar(); return;
    }
    selectedJointPatentId = ''; jointPartnerHighlight = new Set();
    Plotly.react('plot', buildTraces(P, patentColorsForCorp(P, sel.value||''), sel.value||'', jointPartnerHighlight), layout, plotOpts); refreshStatusBar();
  });
  </script>
</body>
</html>
