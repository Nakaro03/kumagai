<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>__PAGE_TITLE__</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fafafa; }
    h1 { font-size: 1.1rem; margin: 0 0 8px; font-weight: 600; }
    #plot { width: 100%; height: 82vh; min-height: 480px; background: #fff; border-radius: 8px; }
    .year-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
      margin: 8px 0 14px; padding: 12px 14px; background: #fff; border-radius: 8px;
      border: 1px solid #e0e0e0; max-width: 780px; }
    #yearSlider { flex: 1 1 200px; min-width: 160px; max-width: 420px; height: 8px; cursor: pointer; accent-color: #2a6a9a; }
    .field-toggles { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 0 0 10px; font-size: 0.88rem; }
    .field-adjustments { display: flex; flex-wrap: wrap; gap: 16px 22px; align-items: center;
      margin: 0 0 12px; padding: 12px 14px; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; max-width: 960px; font-size: 0.88rem; }
    .field-adjustments .adj { display: flex; align-items: center; gap: 8px; }
    .field-adjustments input[type="range"] { width: 120px; accent-color: #1e5a8a; }
    .patent-legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 0 0 12px; font-size: 0.88rem; }
    .patent-legend .swatch { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: middle; border-radius: 2px; border: 1px solid rgba(0,0,0,0.12); }
    .patent-legend .swatch.teal { background: rgba(13, 148, 136, 0.92); }
    .hint { color: #555; font-size: 0.85rem; max-width: 920px; line-height: 1.4; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
    select { min-width: 200px; padding: 6px 8px; }
    #corpPick { min-width: 280px; }
    button { padding: 6px 12px; cursor: pointer; }
    .corp-selection-status { margin: 0 0 12px; padding: 12px 14px; border-radius: 8px; border: 1px dashed #c8c8c8;
      background: #f3f3f3; font-size: 0.9rem; line-height: 1.45; color: #444; max-width: 920px; }
    .corp-selection-status.is-active { border: 2px solid #d97706; background: linear-gradient(105deg, #fffbeb 0%, #fef3c7 100%); }
    .corp-selection-status.is-joint-patent.is-active { border-color: #0d9488; background: linear-gradient(105deg, #ecfdf5 0%, #ccfbf1 100%); }
    .corp-status-label { display: inline-block; margin-right: 6px; padding: 2px 8px; border-radius: 4px;
      background: #b45309; color: #fff; font-size: 0.78rem; font-weight: 700; }
    .corp-select-wrap.has-selection { box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.45); border-radius: 6px; }
  </style>
</head>
<body>
  <h1>__HEADING__</h1>
  <div class="year-bar">
    <label for="yearSlider">年（スライダー）</label>
    <span id="yearMinLabel"></span>
    <input type="range" id="yearSlider" />
    <span id="yearMaxLabel"></span>
    <strong id="yearCurrent"></strong>
  </div>
  <div class="field-toggles">
    <label><input type="checkbox" id="chkHeatmap" checked /> Φ ヒートマップ（薄色）</label>
    <label><input type="checkbox" id="chkContour" checked /> Φ 等高線</label>
    <label><input type="checkbox" id="chkArrows" checked /> −∇Φ 短矢印（色＝|∇Φ|）</label>
  </div>
  <div class="field-adjustments">
    <div class="adj"><label for="rngHeatOp">ヒートマップ透明度</label>
      <input type="range" id="rngHeatOp" min="0.06" max="0.52" step="0.02" value="0.22" /><span id="lblHeatOp"></span></div>
    <div class="adj"><label for="rngArrowOp">矢印透明度</label>
      <input type="range" id="rngArrowOp" min="0.35" max="1" step="0.05" value="0.92" /><span id="lblArrowOp"></span></div>
    <div class="adj"><label for="selNCont">等高線本数</label>
      <select id="selNCont"><option value="10">10</option><option value="14" selected>14</option><option value="18">18</option><option value="24">24</option></select></div>
  </div>
  <div class="patent-legend">
    <span><span class="swatch" style="background:rgba(218,58,58,0.88)"></span>トピック</span>
    <span><span class="swatch" style="background:rgba(42,160,85,0.88)"></span>著者ハイライト時</span>
    <span><span class="swatch teal"></span>関連著者</span>
  </div>
  <p class="hint">著者–トピック二部グラフ。右は arXiv カテゴリ等のトピックノード。年・前処理は学習と揃える。チェックポイントは <code>--data-domain author_topic</code> で学習したものを使う。</p>
  <div class="bar">
    <label for="corpPick">著者:</label>
    <span class="corp-select-wrap" id="corpSelectWrap"><select id="corpPick"><option value="">— 選択なし —</option></select></span>
    <button type="button" id="btnClear">解除</button>
  </div>
  <div id="corpSelectionStatus" class="corp-selection-status"></div>
  <div id="plot"></div>
  <script type="text/plain" id="payload-b64" style="display:none">__PAYLOAD_B64__</script>
  <script>
  function parseJsonFromBase64Utf8(b64) {
    const bin = atob(b64.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }
  const WRAP = parseJsonFromBase64Utf8(document.getElementById('payload-b64').textContent);
  const DATA = WRAP.byYear;
  let currentYear = String(WRAP.defaultYear);
  const singleColor = 'rgba(218, 58, 58, 0.88)';
  const jointColor = 'rgba(42, 160, 85, 0.88)';
  const highlightSingle = 'rgb(200, 28, 28)';
  const highlightJoint = 'rgb(10, 130, 55)';
  const dimColor = 'rgba(170, 170, 170, 0.22)';
  let showHeatmap = true, showContour = true, showArrows = true;
  let heatmapOpacity = 0.22, arrowOpacity = 0.92, nContourLevels = 14;
  let jointPartnerHighlight = new Set(), selectedJointPatentId = '';
  function currentPayload() { return DATA[currentYear]; }
  function isJoint(p) { return p.joint === true; }
  function baseColorsForPatents(P) { return P.patents.map(p => (isJoint(p) ? jointColor : singleColor)); }
  function patentColorsForCorp(P, corpName) {
    if (!corpName) return baseColorsForPatents(P);
    const linked = new Set(P.corpToPatentIds[corpName] || []);
    return P.patents.map(p => linked.has(p.id) ? (isJoint(p) ? highlightJoint : highlightSingle) : dimColor);
  }
  function corpMarkerArrays(P, selectedName, jointSet) {
    const selN = selectedName || '', jset = jointSet && jointSet.size ? jointSet : new Set();
    const fill = [], size = [], lineW = [], lineC = [];
    P.corporations.forEach(c => {
      const orange = Boolean(selN) && c.name === selN;
      const teal = !orange && jset.has(c.name);
      if (orange) { fill.push('rgba(245, 158, 11, 0.95)'); size.push(17); lineW.push(2.4); lineC.push('#92400e'); }
      else if (teal) { fill.push('rgba(13, 148, 136, 0.92)'); size.push(15); lineW.push(2.2); lineC.push('#0f766e'); }
      else { fill.push('rgba(70,130,180,0.82)'); size.push(11); lineW.push(0.5); lineC.push('rgba(255,255,255,0.95)'); }
    });
    return { fill, size, lineW, lineC };
  }
  function fieldLayerTraces(P) {
    const F = P.vectorField, out = [];
    if (!F) return out;
    const phiStyle = (F.meta && F.meta.phiHeatmapStyle) || 'default';
    const arrowMode = (F.meta && F.meta.arrowStyle) || 'magnitude';
    if (showHeatmap && F.heatmap && F.heatmap.z) {
      const hm = {
        type: 'heatmap', x: F.heatmap.x, y: F.heatmap.y, z: F.heatmap.z,
        zsmooth: 'best', opacity: heatmapOpacity, hoverinfo: 'skip', showscale: true,
        colorbar: { title: 'Φ', len: 0.5, thickness: 12, x: 1.02 },
        name: 'Φ'
      };
      if (phiStyle === 'valley_red_peak_blue') {
        hm.zmin = -1;
        hm.zmax = 1;
        hm.colorscale = [
          [0, 'rgb(215,75,75)'],
          [0.5, 'rgb(46,48,58)'],
          [1, 'rgb(72,118,220)']
        ];
        hm.reversescale = false;
        hm.colorbar.title = 'Φ（−1〜1, 谷＝赤・山＝青）';
      } else {
        hm.colorscale = 'RdYlBu';
        hm.reversescale = true;
      }
      out.push(hm);
    }
    if (showContour && F.phiContour && F.phiContour.z) {
      const nc = Math.max(6, Math.min(40, parseInt(String(nContourLevels), 10) || 14));
      const cont = {
        type: 'contour', x: F.phiContour.x, y: F.phiContour.y, z: F.phiContour.z, ncontours: nc,
        contours: { coloring: 'lines', showlabels: false },
        showscale: false, hoverinfo: 'skip', name: 'Φ 等高線'
      };
      if (phiStyle === 'valley_red_peak_blue') {
        cont.line = { width: 1.05, color: 'rgba(55,55,62,0.52)' };
        cont.colorscale = [[0, 'rgba(55,55,62,0.38)'], [0.5, 'rgba(78,78,86,0.52)'], [1, 'rgba(55,55,62,0.38)']];
      } else {
        cont.line = { width: 1.45 };
        cont.colorscale = [[0,'rgba(22,24,38,0.42)'],[0.5,'rgba(45,50,70,0.58)'],[1,'rgba(22,24,38,0.72)']];
      }
      out.push(cont);
    }
    if (showArrows && F.arrowBins) {
      const grayGrid = arrowMode === 'gray_grid';
      F.arrowBins.forEach((bin, idx) => {
        if (!bin.xl || !bin.xl.length) return;
        const lw = grayGrid ? 1.12 : 2.15;
        const col = grayGrid ? 'rgba(82,82,90,0.82)' : bin.color;
        out.push({
          type: 'scatter', mode: 'lines', x: bin.xl, y: bin.yl,
          line: { color: col, width: lw },
          opacity: grayGrid ? 0.72 : arrowOpacity, hoverinfo: 'skip',
          name: grayGrid ? (idx === 0 ? '−∇Φ' : '_h') : (idx === 0 ? '−∇Φ（色＝|∇Φ|）' : '_h'),
          showlegend: idx === 0
        });
      });
    }
    return out;
  }
  function fieldTraceCount(P) { return fieldLayerTraces(P).length; }
  function buildTraces(P, patentColors, selectedCorpName, jointSet) {
    const pc = patentColors || baseColorsForPatents(P), sel = selectedCorpName || '', jset = jointSet || jointPartnerHighlight;
    const cm = corpMarkerArrays(P, sel, jset);
    const layers = fieldLayerTraces(P);
    return layers.concat([
      { type: 'scattergl', mode: 'markers', x: P.patents.map(p => p.x), y: P.patents.map(p => p.y), text: P.patents.map(p => p.hover),
        hoverinfo: 'text', customdata: P.patents.map(p => JSON.stringify({ id: p.id, joint: !!p.joint, coApplicants: p.coApplicants || [] })),
        marker: { symbol: 'square', size: P.patents.map(p => p.id === selectedJointPatentId ? 11 : 8),
          line: { width: P.patents.map(p => p.id === selectedJointPatentId ? 2 : 0.3), color: P.patents.map(p => p.id === selectedJointPatentId ? '#ca8a04' : 'white') }, color: pc }, name: 'トピック' },
      { type: 'scattergl', mode: 'markers', x: P.corporations.map(c => c.x), y: P.corporations.map(c => c.y), text: P.corporations.map(c => c.hover),
        hoverinfo: 'text', customdata: P.corporations.map(c => [c.name]),
        marker: { symbol: 'circle', size: cm.size, color: cm.fill, line: { width: cm.lineW, color: cm.lineC } }, name: '著者' }
    ]);
  }
  const layout = { dragmode: 'pan', hovermode: 'closest', title: { text: '', font: { size: 14 } },
    xaxis: { title: 'latent z1', zeroline: false }, yaxis: { title: 'latent z2', zeroline: false, scaleanchor: 'x', scaleratio: 1 },
    legend: { orientation: 'h', y: 1.12 }, margin: { l: 56, r: 24, t: 52, b: 48 } };
  const plotOpts = { responsive: true, scrollZoom: true };
  const plotEl = document.getElementById('plot'), sel = document.getElementById('corpPick');
  const corpSelectWrap = document.getElementById('corpSelectWrap'), corpStatusEl = document.getElementById('corpSelectionStatus');
  const yearSlider = document.getElementById('yearSlider'), yearCurrent = document.getElementById('yearCurrent');
  const yearMinLabel = document.getElementById('yearMinLabel'), yearMaxLabel = document.getElementById('yearMaxLabel');
  const chkHeatmap = document.getElementById('chkHeatmap'), chkContour = document.getElementById('chkContour'), chkArrows = document.getElementById('chkArrows');
  const rngHeatOp = document.getElementById('rngHeatOp'), rngArrowOp = document.getElementById('rngArrowOp');
  const lblHeatOp = document.getElementById('lblHeatOp'), lblArrowOp = document.getElementById('lblArrowOp'), selNCont = document.getElementById('selNCont');
  if (rngHeatOp) heatmapOpacity = parseFloat(rngHeatOp.value) || heatmapOpacity;
  if (rngArrowOp) arrowOpacity = parseFloat(rngArrowOp.value) || arrowOpacity;
  if (selNCont) nContourLevels = parseInt(selNCont.value, 10) || nContourLevels;
  const yearKeys = Object.keys(DATA).sort((a,b) => Number(a)-Number(b));
  const nYears = yearKeys.length;
  yearMinLabel.textContent = yearKeys[0] + '年'; yearMaxLabel.textContent = yearKeys[nYears-1] + '年';
  yearSlider.min = 0; yearSlider.max = Math.max(0, nYears-1); yearSlider.step = 1;
  yearSlider.value = String(Math.max(0, yearKeys.indexOf(String(WRAP.defaultYear))));
  if (nYears <= 1) yearSlider.disabled = true;
  function sliderIndexToYear(idx) { const i = Math.min(nYears-1, Math.max(0, parseInt(String(idx),10)||0)); return yearKeys[i]; }
  function patentTraceIndex(P) { return fieldTraceCount(P); }
  function corpTraceIndex(P) { return fieldTraceCount(P) + 1; }
  function updateLayoutTitle() {
    const P = currentPayload();
    layout.title.text = '年: ' + currentYear + ' ／ トピック ' + P.patents.length + ' · 著者 ' + P.corporations.length;
  }
  function rebuildCorpSelect() {
    const P = currentPayload();
    while (sel.options.length > 1) sel.remove(1);
    P.corporations.forEach(c => { const o = document.createElement('option'); o.value = c.name;
      o.textContent = c.name + ' ／ この年 ' + c.patentsYear + ' トピック · 全期間 ' + c.patentsTotal + ' 本'; sel.appendChild(o); });
  }
  function refreshStatusBar() {
    const P = currentPayload(), corpName = sel.value || '';
    corpSelectWrap.classList.toggle('has-selection', Boolean(corpName));
    corpStatusEl.replaceChildren();
    corpStatusEl.classList.remove('is-joint-patent');
    if (corpName) {
      corpStatusEl.classList.add('is-active');
      corpStatusEl.innerHTML = '<span class="corp-status-label">選択中</span> <strong>' + corpName + '</strong> <span> ／ この年のトピック ' + (P.corpToPatentIds[corpName]||[]).length + ' 件</span>';
      return;
    }
    if (jointPartnerHighlight.size && selectedJointPatentId) {
      corpStatusEl.classList.add('is-active', 'is-joint-patent');
      corpStatusEl.textContent = '選択: ' + selectedJointPatentId;
      return;
    }
    corpStatusEl.classList.remove('is-active');
    corpStatusEl.textContent = '著者・トピックをクリックで強調。';
  }
  function syncYearFromSlider() { currentYear = sliderIndexToYear(yearSlider.value); yearCurrent.textContent = currentYear + '年'; }
  function redrawYear() { syncYearFromSlider(); sel.value = ''; jointPartnerHighlight = new Set(); selectedJointPatentId = '';
    updateLayoutTitle(); refreshStatusBar(); Plotly.react('plot', buildTraces(currentPayload(), baseColorsForPatents(currentPayload()), '', jointPartnerHighlight), layout, plotOpts); rebuildCorpSelect(); }
  function reactAll() { const P = currentPayload(), k = sel.value || ''; Plotly.react('plot', buildTraces(P, patentColorsForCorp(P, k), k, jointPartnerHighlight), layout, plotOpts); }
  function syncAdjLabels() { if (lblHeatOp) lblHeatOp.textContent = '('+heatmapOpacity.toFixed(2)+')'; if (lblArrowOp) lblArrowOp.textContent = '('+arrowOpacity.toFixed(2)+')'; }
  syncYearFromSlider(); syncAdjLabels(); updateLayoutTitle(); refreshStatusBar();
  Plotly.newPlot('plot', buildTraces(currentPayload(), null, '', jointPartnerHighlight), layout, plotOpts); rebuildCorpSelect();
  yearSlider.addEventListener('input', () => redrawYear());
  chkHeatmap.addEventListener('change', () => { showHeatmap = chkHeatmap.checked; reactAll(); });
  chkContour.addEventListener('change', () => { showContour = chkContour.checked; reactAll(); });
  chkArrows.addEventListener('change', () => { showArrows = chkArrows.checked; reactAll(); });
  rngHeatOp.addEventListener('input', () => { heatmapOpacity = parseFloat(rngHeatOp.value)||0.22; syncAdjLabels(); reactAll(); });
  rngArrowOp.addEventListener('input', () => { arrowOpacity = parseFloat(rngArrowOp.value)||0.92; syncAdjLabels(); reactAll(); });
  selNCont.addEventListener('change', () => { nContourLevels = parseInt(selNCont.value,10)||14; reactAll(); });
  function applyHighlight(corpName) { jointPartnerHighlight = new Set(); selectedJointPatentId = ''; const P = currentPayload();
    Plotly.react('plot', buildTraces(P, patentColorsForCorp(P, corpName), corpName||'', jointPartnerHighlight), layout, plotOpts); sel.value = corpName||''; refreshStatusBar(); }
  sel.addEventListener('change', () => applyHighlight(sel.value));
  document.getElementById('btnClear').addEventListener('click', () => applyHighlight(''));
  plotEl.on('plotly_click', (ev) => {
    const pt = ev.points && ev.points[0]; if (!pt) return; const P = currentPayload(), pi = patentTraceIndex(P), ci = corpTraceIndex(P);
    if (pt.curveNumber === ci && pt.customdata && pt.customdata[0]) { applyHighlight(pt.customdata[0]); return; }
    if (pt.curveNumber !== pi) return;
    let meta = {}; try { const s = typeof pt.customdata === 'string' ? pt.customdata : (Array.isArray(pt.customdata)?pt.customdata[0]:''); if (s) meta = JSON.parse(s); } catch(e) {}
    if (meta.joint && Array.isArray(meta.coApplicants) && meta.coApplicants.length >= 2) {
      selectedJointPatentId = String(meta.id||''); jointPartnerHighlight = new Set(meta.coApplicants.map(String)); sel.value = '';
      Plotly.react('plot', buildTraces(P, baseColorsForPatents(P), '', jointPartnerHighlight), layout, plotOpts); refreshStatusBar(); return;
    }
    selectedJointPatentId = ''; jointPartnerHighlight = new Set();
    Plotly.react('plot', buildTraces(P, patentColorsForCorp(P, sel.value||''), sel.value||'', jointPartnerHighlight), layout, plotOpts); refreshStatusBar();
  });
  </script>
</body>
</html>
